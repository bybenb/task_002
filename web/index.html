    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Simulador de Espessura de Linhas",
        "description": "Simulador de espessura de linhas usando múltiplas linhas paralelas em computação gráfica",
        "url": "https://cg.unitic.site",
        "applicationCategory": "Educational",
        "operatingSystem": "Web",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "EUR"
        },
        "author": {
            "@type": "Organization",
            "name": "UNITIC",
            "url": "https://www.unitic.site"
        }
    }
    </script>

<body>
    <div class="container">
        <header>
            <h1>Simulador de Espessura de Linhas</h1>
            <p class="subtitle">Visualize como múltiplas linhas paralelas simulam espessura</p>
        </header>

        <main>
            <!-- Canvas para desenho -->
            <div class="canvas-wrapper">
                <canvas id="canvas" aria-label="Área de visualização do simulador de linhas"></canvas>
            </div>

            <!-- Informações -->
            <section class="info-section" aria-label="Informações de espessura atual">
                <div class="info-card">
                    <span class="label">Espessura Atual:</span>
                    <span class="value" id="espessura-valor">1</span>
                </div>
            </section>

            <!-- Controles -->
            <section class="controls" aria-label="Controles de ajuste de espessura">
                <button class="btn btn-decrease" id="btn-diminuir" aria-label="Diminuir espessura da linha">
                    <span class="icon">−</span>
                    <span class="text">Diminuir</span>
                </button>

                <input type="range" id="slider-espessura" min="1" max="50" value="1" class="slider" aria-label="Controle deslizante para ajuste fino da espessura">

                <button class="btn btn-increase" id="btn-aumentar" aria-label="Aumentar espessura da linha">
                    <span class="icon">+</span>
                    <span class="text">Aumentar</span>
                </button>
            </section>

 

            <!-- Botão Reset -->
            <button class="btn btn-reset" id="btn-reset" aria-label="Resetar simulador para valores iniciais">
                Resetar
            </button>
        </main>

        <footer>
            <p>&copy; 2026 UNITIC - Departamento de Tecnologia da Informação</p>
            <p>Projeto de Visualização Gráfica - Simulador de Espessura de Linhas com Múltiplas Linhas Paralelas</p>
        </footer>
    </div>

    <!-- Script principal -->
    <script src="script.js" defer></script>
